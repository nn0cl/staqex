# Target-owned runtime routing for AI review and implementation.
# Created or refreshed by: scripts/configure-ai-collaboration.sh
# Policy: docs/collaboration/runtime-routing.md
#
# Do not store secrets, API keys, or provider credentials here.
# An empty model string means capability-class routing only
# (see docs/collaboration/model-tool-capability-matrix.md).
# The template does not name commercial models.

[review]
# separate_context | same_context | ask
isolation = "same_context"
model = ""

[review.large_change]
# Opt-in; conditions combine with OR and trigger only when strictly exceeded.
enabled = false
source_line_threshold = 300
changed_line_threshold = 500
changed_file_threshold = 5
cross_module_trigger = true
isolation = "separate_context"
model = ""
# Optional positive host review-context token budget; not enforced by this tool.
# token_budget = 12000

[implementation]
# host | separate_context | ask
isolation = "host"
model = ""

[source_structure]
source_file_line_threshold = 300
implementation_file_line_threshold = 300
changed_line_threshold = 500
source_globs = ["*.py", "*.sh", "*.js", "*.jsx", "*.ts", "*.tsx", "*.rs", "*.go", "*.c", "*.h", "*.cpp", "*.hpp", "*.java", "*.rb", "*.swift"]
implementation_globs = ["*.py", "*.sh", "*.js", "*.jsx", "*.ts", "*.tsx", "*.rs", "*.go", "*.c", "*.h", "*.cpp", "*.hpp", "*.java", "*.rb", "*.swift"]
exclude_globs = []

[source_structure.modules]
# Logical ownership supplied by the adopter, e.g. runtime = ["runtime/*"].
# Empty or ambiguous ownership is unknown when cross-module review is enabled.
